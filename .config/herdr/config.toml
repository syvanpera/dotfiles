onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
default_shell = "fish"
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
settings = "prefix+,"
reload_config = "prefix+."
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+y"

# Panes
split_horizontal = ["prefix+h", "alt+enter", "prefix+-"]
split_vertical = ["prefix+v", "alt+shift+enter", "prefix+<"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

# focus_pane_left = "ctrl+h"
# focus_pane_down = "ctrl+j"
# focus_pane_up = "ctrl+k"
# focus_pane_right = "ctrl+l"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
# resize_pane_left = "ctrl+alt+h"
# resize_pane_down = "ctrl+alt+j"
# resize_pane_up = "ctrl+alt+k"
# resize_pane_right = "ctrl+alt+l"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+w"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left", "alt+h"]
next_tab = ["prefix+n", "alt+right", "alt+l"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = ["alt+shift+left", "alt+shift+h"]
move_tab_next = ["alt+shift+right", "alt+shift+l"]

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+w"
previous_workspace = ["prefix+shift+p", "alt+up", "alt+k"]
next_workspace = ["prefix+shift+n", "alt+down", "alt+j"]

goto = "prefix+s"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = true

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [
  # No built-in session entry; resolve the running session from its socket path
  { type = "command", command = "herdr session list --json | jq -r '.sessions[] | select(.socket_path==env.HERDR_SOCKET_PATH) | .name'", interval_seconds = 30, timeout_seconds = 3 },
  { type = "zoom" },
  { type = "text", text = "@" },
  { type = "hostname" },
  { type = "text", text = " " },
]
# tab_bar_right_separator = " · "

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
sidebar.agents.row_gap = 1
sidebar_min_width = 30

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "herdr pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "clear screen"

[[keys.command]]
key = "prefix+_"
type = "shell"
command = "herdr pane split --current --direction down --ratio 0.7 --focus"
description = "split 70/30 down"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "sh -c 'PANE=$(herdr tab create --label Claude --focus | jq .result.root_pane.pane_id); herdr pane run \"$PANE\" claude'"
description = "run agent"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "run lazygit"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "ctrl+alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "ctrl+alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[[keys.command]]
key = "alt+p"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "open Sesh picker"

[[keys.command]]
key = "alt+n"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "switch to previous Sesh workspace"
