local:
  db_path: null
  blob_dir: null
  inline_images: auto
  image_optimization: off
  attachment_lifecycle:
    grace_days: 7
    quota_bytes: 10737418240
    preview_quota_bytes: 536870912
    maintenance_limit: 128
sync:
  enabled: false
  server_url: null
  interval_seconds: 30
  auth_token: ''
daemon:
  wake_addr: 127.0.0.1:47631
workspace:
  default: null
  routes:
    - workspace: "asteroid"
      paths: ["~/work/asteroid"]
project:
  overrides:
    # aven-managed project path mapping
    - workspace_id: '0000000000000000'
      workspace: default
      project: rig
      paths:
        - /home/tuomo/work/personal/rig
    # aven-managed project path mapping
    - workspace_id: '0000000000000000'
      workspace: default
      project: vespa-taksi
      paths:
        - /home/tuomo/work/personal/vespa-taksi
agent:
  task_intake:
    command: null
    args:
    - -p
    - --no-session-persistence
    - --bare
    - '{prompt}'
    timeout_seconds: 45
    system_prompt: null
update:
  automatic_checks: true
tui:
  sidebar:
    views:
    - queue
    - ready
    - blocked
    - overdue
    - all
    - open
    - inbox
    - active
    - backlog
    - todo
    - upcoming
    - done
    - conflicts
    - epics
    - recurring
    - recent_actions
    - search
  columns:
  - name: Inbox
    statuses:
    - inbox
  - name: Backlog
    statuses:
    - backlog
  - name: Todo
    statuses:
    - todo
  - name: Active
    statuses:
    - active
  - name: Done
    statuses:
    - done
    - canceled
  commands: []
