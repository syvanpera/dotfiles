# Shell
set -g default-command fish
# set -g default-shell fish

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys-format csi-u
# set -g extended-keys on
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm-ghostty:extkeys'
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator " #[fg=blue]· "
set -gw automatic-rename on
set -gw automatic-rename-format '#{pane_current_command}'
# set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=blue,bg=default]#[fg=black,bg=blue,bold] #S #[fg=blue,bg=default] "
# set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g status-right '#[fg=blue]#{?pane_in_mode,  ,}#{?client_prefix,󰘳  ,}#{?window_zoomed_flag,  ,} #(~/.config/tmux/scripts/git-repo.sh #{pane_current_path}) #[fg=brightblack]#h '
# set -g window-status-format "#[fg=brightblack]#I:#W"
# set -g window-status-current-format "#[fg=blue,bold]#I:#W"
set -g window-status-format '#[fg=brightblack]#I:#W#{?@workmux_status, #{@workmux_status},}'
set -g window-status-current-format '#[fg=yellow,bold]#I:#W#{?@workmux_status, #{@workmux_status},}'
set -g pane-border-style "fg=brightblack"
set -g pane-border-status top
set -g pane-border-format ""
# set -g pane-border-format " #{pane_index} #{pane_current_command} "
# set -g pane-border-format " [ #T ] #{pane_current_path} "
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
