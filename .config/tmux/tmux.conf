# Terminal multiplexer
# https://github.com/tmux/tmux

# Set prefix
unbind C-b
set -g prefix C-Space
# set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" . source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Clear console
bind C-l send-keys C-l

# Split window

# Vi mode for copy
bind Escape copy-mode
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel
bind -Tcopy-mode-vi Escape send -X cancel

# Pane Controls
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane vertically 80/20" _ split-window -v -l 20 -c "#{pane_current_path}"
bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" c kill-pane
#bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
#bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
#bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# Resize pane
bind -N "Resize pane left" -n -n C-M-h resize-pane -L 1
bind -N "Resize pane down" -n -n C-M-l resize-pane -R 1
bind -N "Resize pane up" -n C-M-j resize-pane -D 1
bind -N "Resize pane right" -n C-M-k resize-pane -U 1

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" 1 select-window -t 1
bind -N "Switch to window 2" 2 select-window -t 2
bind -N "Switch to window 3" 3 select-window -t 3
bind -N "Switch to window 4" 4 select-window -t 4
bind -N "Switch to window 5" 5 select-window -t 5
bind -N "Switch to window 6" 6 select-window -t 6
bind -N "Switch to window 7" 7 select-window -t 7
bind -N "Switch to window 8" 8 select-window -t 8
bind -N "Switch to window 9" 9 select-window -t 9

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Last session" -n M-n switch-client -l\; refresh-client -S
bind -N "Next session" -n M-tab switch-client -n
bind -N "Previous session" -n M-btab switch-client -p
bind -N "Last session" tab switch-client -l\; refresh-client -S

# Quick window switching
bind -n M-o select-window -l
bind -n M-l next-window
bind -n M-h previous-window
bind -n M-S-L { swap-window -t +1; next-window }
bind -n M-S-H { swap-window -t -1; previous-window }

# bind -N "Run agent" a new-window -n 'agent' -c "#{pane_current_path}" "omarchy-agent --pick --inline"
# bind -N "Run lazygit" g display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" lazygit
# bind -N "Run yazi" r display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" yazi
bind -N "Run lazygit" g new-window -n 'lazygit' -c "#{pane_current_path}" lazygit
bind -N "Run yazi" r new-window -n 'yazi' -c "#{pane_current_path}" yazi
bind -N "Run aven with project" a new-window -n 'aven' -c "#{pane_current_path}" "aven tui -p"
bind -N "Run aven" A new-window -n 'aven' -c "#{pane_current_path}" "aven tui"

# aven
# bind -N "Run aven with project" a display-popup -E -d '#{pane_current_path}' -w 80% -h 80% 'aven tui -p'
bind -N "Run aven with project" -n M-w display-popup -E -d '#{pane_current_path}' -w 80% -h 80% 'aven tui -p'
bind -N "Run aven" -n M-a display-popup -E -d '#{pane_current_path}' -w 80% -h 80% 'aven tui'
bind -N "Add aven task" -n M-t display-popup -E -d '#{pane_current_path}' -w 120 -h 30 'aven tui --add-task-only'

# workmux
bind -N "Workmux sidebar" e run-shell "workmux sidebar"
bind -N "Workmux dashboard" w display-popup -h 80% -w 80% -E "workmux dashboard"

# Alt+j / Alt+k to cycle agents (no prefix needed)
bind -n M-j run-shell "workmux sidebar next"
bind -n M-k run-shell "workmux sidebar prev"

# prefix+1..9 to jump directly
# bind 1 run-shell "workmux sidebar jump 1"
# bind 2 run-shell "workmux sidebar jump 2"
# bind 3 run-shell "workmux sidebar jump 3"
# bind 4 run-shell "workmux sidebar jump 4"
# bind 5 run-shell "workmux sidebar jump 5"
# bind 6 run-shell "workmux sidebar jump 6"
# bind 7 run-shell "workmux sidebar jump 7"
# bind 8 run-shell "workmux sidebar jump 8"
# bind 9 run-shell "workmux sidebar jump 9"

# tmux.nvim navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }
# bind-key -n 'C-n' if-shell "$is_vim" 'send-keys C-n' { if -F '#{window_end_flag}' '' 'select-window -n' }
# bind-key -n 'C-p' if-shell "$is_vim" 'send-keys C-p' { if 'test #{window_index} -gt #{base-index}' 'select-window -p' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'
# bind-key -T copy-mode-vi 'C-n' if -F '#{window_end_flag}' '' 'select-window -n'
# bind-key -T copy-mode-vi 'C-p' if 'test #{window_index} -gt #{base-index}' 'select-window -p'

# sesh
bind -n M-p display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh
